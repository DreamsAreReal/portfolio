server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_static on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript application/json
               application/xml application/manifest+json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Fingerprinted, immutable static assets (fonts + vendored JS) — cache hard
    location ~* \.(woff2|js)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Raster/vector brand assets (og-image, icons) — change rarely, cache a week
    location ~* \.(png|ico|svg)$ {
        add_header Cache-Control "public, max-age=604800";
    }

    # Web app manifest — correct content-type (nginx mime.types omits it) + short cache
    location = /site.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "public, max-age=86400";
    }

    # SEO surface — revalidate daily so updates ship promptly
    location = /sitemap.xml {
        add_header Cache-Control "public, max-age=86400";
    }
    location = /robots.txt {
        add_header Cache-Control "public, max-age=86400";
    }

    # HTML always revalidated so content updates ship instantly
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

